name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .speech-model
          key: speech-model-${{ hashFiles('speech-model.json', 'diarization-model.json') }}
      - run: npm ci
      - run: npm run speech-model
      - run: npm run diarization-model
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
